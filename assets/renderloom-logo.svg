<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <rect width="500" height="500" rx="100" fill="#120E1C" />

  <defs>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>
  </defs>

  <!-- Structural Loom Frame -->
  <rect x="110" y="110" width="280" height="280" rx="40" fill="none" stroke="url(#violetGrad)" stroke-width="32" />

  <!-- Precision Weaving Strands (Warp / Code lines) -->
  <line x1="200" y1="110" x2="200" y2="390" stroke="#F59E0B" stroke-width="24" stroke-linecap="round" />
  <line x1="260" y1="160" x2="260" y2="340" stroke="#FBBF24" stroke-width="24" stroke-linecap="round" />
  <line x1="320" y1="210" x2="320" y2="290" stroke="#FDE68A" stroke-width="24" stroke-linecap="round" />

  <!-- Vector Anchor Point / Studio Node -->
  <circle cx="200" cy="250" r="18" fill="#120E1C" stroke="#F59E0B" stroke-width="12" />
</svg>