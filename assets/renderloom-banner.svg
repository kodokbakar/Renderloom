<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="auto">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0B18" />
      <stop offset="60%" stop-color="#140E22" />
      <stop offset="100%" stop-color="#1B122E" />
    </linearGradient>

    <!-- Logo Gradients -->
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <!-- Subtle Grid Pattern for Code / Canvas Vibe -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.08" />
    </pattern>

    <!-- Ambient Glow Filter -->
    <radialGradient id="glow" cx="80%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="400" rx="16" fill="url(#grid)" />
  <rect width="1200" height="400" rx="16" fill="url(#glow)" />

  <!-- Subtle Border for GitHub Dark Mode separation -->
  <rect width="1198" height="398" x="1" y="1" rx="15" fill="none" stroke="#8B5CF6" stroke-opacity="0.25" stroke-width="2" />

  <!-- LEFT: Konsep B Logo Icon (Scaled & Positioned) -->
  <g transform="translate(100, 75) scale(0.625)">
    <!-- Loom Outer Frame -->
    <rect x="0" y="0" width="400" height="400" rx="60" fill="#120E1C" stroke="url(#violetGrad)" stroke-width="42" />

    <!-- Weaving Warp Strands (JSX/Code Lines) -->
    <line x1="130" y1="0" x2="130" y2="400" stroke="#F59E0B" stroke-width="32" stroke-linecap="round" />
    <line x1="215" y1="70" x2="215" y2="330" stroke="#FBBF24" stroke-width="32" stroke-linecap="round" />
    <line x1="300" y1="140" x2="300" y2="260" stroke="#FDE68A" stroke-width="32" stroke-linecap="round" />

    <!-- Vector Node -->
    <circle cx="130" cy="200" r="26" fill="#120E1C" stroke="#F59E0B" stroke-width="16" />
  </g>

  <!-- RIGHT: Typography & Product Architecture -->
  <g transform="translate(430, 0)">
    <!-- Category Badge -->
    <g transform="translate(0, 105)">
      <rect width="210" height="32" rx="16" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-opacity="0.4" stroke-width="1.5" />
      <text x="105" y="21" fill="#C4B5FD" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="1.5" text-anchor="middle">LOCAL-FIRST STUDIO</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="195" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="900" letter-spacing="-1.5">
      Renderloom
    </text>

    <!-- Subtitle / Value Proposition -->
    <text x="0" y="240" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, &#39;Segoe UI&#39;, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="500">
      Deterministic, code-first AI image design studio.
    </text>

    <!-- Tech Stack Pipeline Indicators -->
    <g transform="translate(0, 280)">
      <!-- LLM Pill -->
      <g transform="translate(0, 0)">
        <rect width="110" height="34" rx="8" fill="#1E1630" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1" />
        <text x="55" y="22" fill="#DDD6FE" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle">LLM Brief</text>
      </g>

      <text x="125" y="23" fill="#6D28D9" font-family="sans-serif" font-size="16" font-weight="bold">→</text>

      <!-- JSX Pill -->
      <g transform="translate(145, 0)">
        <rect width="105" height="34" rx="8" fill="#1E1630" stroke="#F59E0B" stroke-opacity="0.4" stroke-width="1" />
        <text x="52.5" y="22" fill="#FDE68A" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle">JSX Code</text>
      </g>

      <text x="265" y="23" fill="#6D28D9" font-family="sans-serif" font-size="16" font-weight="bold">→</text>

      <!-- Satori / Engine Pill -->
      <g transform="translate(285, 0)">
        <rect width="85" height="34" rx="8" fill="#1E1630" stroke="#8B5CF6" stroke-opacity="0.3" stroke-width="1" />
        <text x="42.5" y="22" fill="#DDD6FE" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="600" text-anchor="middle">Satori</text>
      </g>

      <text x="385" y="23" fill="#6D28D9" font-family="sans-serif" font-size="16" font-weight="bold">→</text>

      <!-- Output Pill (Crisp SVG / PNG) -->
      <g transform="translate(405, 0)">
        <rect width="150" height="34" rx="8" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1.5" />
        <text x="75" y="22" fill="#FBBF24" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" font-weight="700" text-anchor="middle">SVG / Resvg PNG</text>
      </g>
    </g>
  </g>
</svg>